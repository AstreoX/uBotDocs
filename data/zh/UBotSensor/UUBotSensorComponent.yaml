UUBotSensorComponent:
  summary: 所有 uBot 传感器组件的基类。组件本身就是传感器坐标系；启动后按 Update Rate Hz 在 uBot 仿真时间上定时采样，每帧最多采样一次。
  sourceHash: "85312f0b2f95"

UUBotSensorComponent.StartSensor:
  summary: 启动传感器：立即采样一次，之后按 Update Rate Hz 定时采样。Sensor Enabled 为 false 时返回 false。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.StopSensor:
  summary: 停止定时采样。手动调用 Sample Sensor 仍然可以采样。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.SampleSensor:
  summary: 立即采样一次，不要求传感器已经启动。本次样本为 Valid 时返回 true。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.SetUpdateRateHz:
  summary: 修改采样频率，限制在 0.1–240 Hz。运行中的传感器不会重启，下一次采样时刻保持不变。
  sourceHash: "41dc92fb30fb"

UUBotSensorComponent.GetLatestFrameHeader:
  summary: 返回最近一次采样的帧头。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.GetDroppedSampleCount:
  summary: 因为一帧跨过了多个采样时刻而跳过的采样次数。Start Sensor 时清零。
  sourceHash: "f85e1ad02e9f"

UUBotSensorComponent.OnSensorSampled:
  summary: 每次采样后触发，Header 是本次的帧头。每种传感器都有这个事件。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.UpdateRateHz:
  summary: 自动采样频率，单位 Hz。运行中修改请用 Set Update Rate Hz。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.bAutoStart:
  summary: 为 true 时在 BeginPlay 自动启动传感器。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.bSensorEnabled:
  summary: 为 false 时无法启动；手动采样只得到 Disabled 帧头。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.SensorId:
  summary: 写入帧头的传感器标识。为空时用组件名；各传感器有自己的默认值。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.FrameId:
  summary: 写入帧头的坐标系名（TF frame id）。为空时用传感器标识；各传感器有自己的默认值。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.RandomSeed:
  summary: 噪声随机序列的种子。每次 Start Sensor 都用它重置随机序列。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.bNoiseEnabled:
  summary: 噪声总开关。只对 IMU、里程计和 2D / 3D 激光雷达有效，位姿传感器和相机没有噪声。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.bDebugVisualization:
  summary: 为 true 时，运行中画出调试射线。只有激光雷达使用。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.bHideSensorModelInGame:
  summary: 为 true 时，游戏中隐藏传感器模型。运行中可用 Set Sensor Model Visible in Game 切换。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.IsSensorModelVisibleInGame:
  summary: 返回游戏中是否显示传感器模型，等于 Hide Sensor Model in Game 取反。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.SetSensorModelVisibleInGame:
  summary: 运行中显示或隐藏传感器模型。Model Visible 为 true 时显示。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.OnSensorStarted:
  summary: 传感器成功启动时触发，在启动时的第一个样本之前。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.OnSensorStopped:
  summary: 传感器从运行变为停止时触发，包括运行结束时的自动停止。
  sourceHash: "e3b0c44298fc"

UUBotSensorComponent.OnSensorError:
  summary: 采样出错时触发，Error Message 说明原因，例如位姿传感器的参考组件无效。
  sourceHash: "e3b0c44298fc"
