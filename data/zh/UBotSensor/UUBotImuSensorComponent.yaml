UUBotImuSensorComponent:
  summary: 模拟 IMU。按固定频率输出组件本地坐标系下的角速度（rad/s）和比力（m/s²），以及世界坐标系下的姿态四元数；可选噪声、偏置、低通滤波和限幅。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.GetLatestIMUData:
  summary: 返回最近一次采样的 IMU 数据副本，不会触发新的采样。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.OnImuDataUpdated:
  summary: 每次 IMU 采样后触发，包括无效样本。Data 是本次的完整数据。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.SampleIMU:
  summary: 立即采样一次 IMU，本次样本为 Valid 时返回 true。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.ResetIMUBias:
  summary: 把当前偏置恢复为 Details 中设置的 Accelerometer Bias 和 Gyroscope Bias，丢弃随机游走累积的漂移。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.ResetIMUHistory:
  summary: 清空差分用的历史状态。之后的两次采样是 Warming Up，第三次恢复 Valid。
  sourceHash: "e3b0c44298fc"
