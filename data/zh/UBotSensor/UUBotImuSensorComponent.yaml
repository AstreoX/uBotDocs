UUBotImuSensorComponent:
  summary: 模拟 IMU。按固定频率输出组件本地坐标系下的角速度（rad/s）和比力（m/s²），以及世界坐标系下的姿态四元数；可选噪声、偏置、低通滤波和限幅。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.GetLatestIMUData:
  summary: 返回最近一次采样的 IMU 数据副本，不会触发新的采样。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.OnImuDataUpdated:
  summary: 每次 IMU 采样后触发，包括无效样本。Data 是本次的完整数据。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.SampleIMU:
  summary: 立即采样一次 IMU，本次样本为 Valid 时返回 true。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.ResetIMUBias:
  summary: 把当前偏置恢复为 Details 中设置的 Accelerometer Bias 和 Gyroscope Bias，丢弃随机游走累积的漂移。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.ResetIMUHistory:
  summary: 清空差分用的历史状态。之后的两次采样是 Warming Up，第三次恢复 Valid。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.AccelerometerBias:
  summary: 加速度计固定偏置，单位 m/s²，本地坐标系。只在 Noise Enabled 打开时加到输出上。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.AccelerometerBiasRandomWalkStdDev:
  summary: 加速度计偏置的随机游走强度，单位 m/s²/√s。需先勾选 Noise Enabled。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.AccelerometerNoiseStdDev:
  summary: 加速度计白噪声强度，单位 m/s²。需先勾选 Noise Enabled。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.FrameId:
  summary: 写入帧头的坐标系名，默认 imu_sensor。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.GyroscopeBias:
  summary: 陀螺仪固定偏置，单位 rad/s，本地坐标系。只在 Noise Enabled 打开时加到输出上。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.GyroscopeBiasRandomWalkStdDev:
  summary: 陀螺仪偏置的随机游走强度，单位 rad/s/√s。需先勾选 Noise Enabled。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.GyroscopeNoiseStdDev:
  summary: 陀螺仪白噪声强度，单位 rad/s。需先勾选 Noise Enabled。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.LowPassCutoffHz:
  summary: 低通滤波的截止频率，单位 Hz。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.MaxAngularVelocity:
  summary: 限幅时角速度大小的上限，单位 rad/s。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.MaxLinearAcceleration:
  summary: 限幅时比力大小的上限，单位 m/s²。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.MaxSampleDeltaSeconds:
  summary: 相邻样本的间隔超过它，样本为 Invalid Delta Time，历史被清空。单位 s。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.SensorId:
  summary: 写入帧头的传感器标识，默认 imu_sensor。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.TeleportAngleDegrees:
  summary: 相邻样本间转角超过它，样本为 Teleport Detected，历史被清空。单位度。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.TeleportDistanceMeters:
  summary: 相邻样本间位移超过它，样本为 Teleport Detected，历史被清空。单位 m。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.UpdateRateHz:
  summary: 自动采样频率，默认 100 Hz。运行中修改请用 Set Update Rate Hz。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.bClampOutput:
  summary: 为 true 时，把角速度和比力的大小限制在上限以内，方向不变。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.bLowPassFilterEnabled:
  summary: 为 true 时，对角速度和比力做一阶低通滤波。
  sourceHash: "e3b0c44298fc"

UUBotImuSensorComponent.GetBodyStateAgeSeconds:
  summary: 最新样本的年龄：取样时刻减去所用刚体状态的时刻（物理步落后取样多久），单位 s；没有用到状态时为 0。
  sourceHash: "622fe636a5b1"

UUBotImuSensorComponent.IsUsingBodyState:
  summary: 最新样本的运动量是否取自刚体状态源。
  sourceHash: "3d201dc3cd11"

UUBotImuSensorComponent.bUseBodyState:
  summary: 机体由刚体状态源（物理后端的绑定、载具自己的积分器）驱动时，速度和加速度读它的状态，而不是对位姿差分；机体到传感器之间的部分按刚性连接处理。传感器装在会自己运动的部件上（例如云台）时关闭。
  sourceHash: "350d18a16f61"
