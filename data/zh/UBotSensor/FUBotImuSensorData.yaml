FUBotImuSensorData:
  summary: 一次 IMU 采样：帧头、世界姿态、本地角速度和比力，以及三组方差。
  sourceHash: "e3b0c44298fc"

FUBotImuSensorData.Header:
  summary: 帧头，含 Valid 和 Status。
  sourceHash: "e3b0c44298fc"

FUBotImuSensorData.OrientationQuaternion:
  summary: 组件在 UE 世界坐标系下的旋转，不加噪声；无效样本也有值。
  sourceHash: "e3b0c44298fc"

FUBotImuSensorData.AngularVelocityRadPerSecond:
  summary: 传感器本地坐标系（X 前、Y 右、Z 上）下的角速度，单位 rad/s；非 Valid 样本为 0。
  sourceHash: "e3b0c44298fc"

FUBotImuSensorData.LinearAccelerationMetersPerSecondSquared:
  summary: 本地坐标系下的比力（运动加速度减去重力），单位 m/s²；静止水平时约为 (0, 0, 9.8)。
  sourceHash: "e3b0c44298fc"

Break:FUBotImuSensorData:
  summary: 把 UBot Imu Sensor Data 拆成帧头、姿态、角速度、比力和三组方差。
  sourceHash: "30460fda8aae"

FUBotImuSensorData.AngularVelocityVariance:
  summary: 角速度方差，单位 rad²/s²，等于 Gyroscope Noise Std Dev 的平方，三个轴相同。Noise Enabled 关闭时也照样填写。
  sourceHash: "e3b0c44298fc"

FUBotImuSensorData.LinearAccelerationVariance:
  summary: 比力方差，单位 m²/s⁴，等于 Accelerometer Noise Std Dev 的平方，三个轴相同。Noise Enabled 关闭时也照样填写。
  sourceHash: "e3b0c44298fc"

FUBotImuSensorData.OrientationVariance:
  summary: 姿态方差。目前不填充，始终为 0。
  sourceHash: "e3b0c44298fc"

Make:FUBotImuSensorData:
  summary: 用各字段组装一个 UBot Imu Sensor Data。
  sourceHash: "c1170372de5f"
