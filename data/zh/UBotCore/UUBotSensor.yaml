UUBotSensor:
  summary: "产生 uBot 样本的对象所实现的接口。uBotSensor 的全部传感器组件均实现该接口，也支持自定义蓝图 Actor 或组件实现。"
  sourceHash: "e3b0c44298fc"

UUBotSensor.GetLatestSensorHeader:
  summary: 返回最近一次采样的帧头。
  sourceHash: "e3b0c44298fc"

UUBotSensor.GetSensorFrameComponent:
  summary: "返回传感器坐标系对应的场景组件，TF 根据其变换发布坐标关系；返回值可以为空。"
  sourceHash: "9ebf2c717cd6"

UUBotSensor.GetSensorFrameId:
  summary: "返回传感器所在坐标系的名称（Frame Id）。"
  sourceHash: "e3b0c44298fc"

UUBotSensor.GetSensorId:
  summary: "返回传感器标识（Sensor Id）。"
  sourceHash: "e3b0c44298fc"

UUBotSensor.GetSensorType:
  summary: "返回稳定的简短类型名称，例如 Pose、Odometry、IMU、Lidar2D、Lidar3D、RGBCamera 或 DepthCamera。"
  sourceHash: "a43b0c4f5ec1"

UUBotSensor.IsSensorRunning:
  summary: "返回传感器是否正在按设定频率自动采样。"
  sourceHash: "e3b0c44298fc"
