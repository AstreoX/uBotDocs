Break:FUBotBodyRateCommand:
  summary: 把 UBot Body Rate Command 拆成机体角速度、推力、时间戳和来源等字段。
  sourceHash: "3913f6d36fc1"

FUBotBodyRateCommand:
  summary: 飞行器的机体角速度请求：机体角速度，加推力或爬升速度。
  sourceHash: "46bfdc5c5367"

FUBotBodyRateCommand.BodyRateRadiansPerSecond:
  summary: 期望的机体系角速度，用 UE 的坐标轴和旋转方向（+Z 是向右偏航），单位 rad/s。
  sourceHash: "2b72510b655c"

FUBotBodyRateCommand.NormalizedThrust:
  summary: 总推力占飞行器最大总推力的比例，范围 0 到 1。
  sourceHash: "27e6215f7b00"

FUBotBodyRateCommand.Source:
  summary: 来源标签，格式自由，比如 ROS、MCP、Blueprint。
  sourceHash: "9030c0986c07"

FUBotBodyRateCommand.TimestampSeconds:
  summary: 发出指令时的仿真时间，单位秒。
  sourceHash: "c2d8ddc4c0fb"

FUBotBodyRateCommand.VerticalVelocityMetersPerSecond:
  summary: 不使用推力时的爬升速度，单位 m/s，向上为正；0 表示保持高度。
  sourceHash: "adc1b4d6987c"

FUBotBodyRateCommand.bUseThrust:
  summary: 为 true 时使用 Normalized Thrust；否则由接收者自己调节推力，以达到 Vertical Velocity。
  sourceHash: "c930cdcabd1a"

Make:FUBotBodyRateCommand:
  summary: 用机体角速度、推力、时间戳和来源等字段构造一个 UBot Body Rate Command。
  sourceHash: "ffc88427ba0d"
