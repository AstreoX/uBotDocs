FUBotPackageProblem.Dependency:
  summary: 涉及的被依赖 Package；依赖环和没有名字的依赖项为空。
  sourceHash: "bf6f819f00d8"

FUBotPackageProblem.Kind:
  summary: 问题的类型。
  sourceHash: "e3b0c44298fc"

FUBotPackageProblem.Message:
  summary: 与 Problems 里对应那一条相同的文字。
  sourceHash: "b12ce55fbd5f"
