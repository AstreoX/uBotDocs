  sourceHash: "34937c5d58b4"

Make:FUBotPackageProblem:
  summary: 用各个字段拼出一个 UBot Package Problem。
  sourceHash: "766a5835f049"

FUBotPackageProblem:
  summary: Problems 里一条问题的结构化形式。
  sourceHash: "0b37b56f1c75"

FUBotPackageProblem.Constraint:
