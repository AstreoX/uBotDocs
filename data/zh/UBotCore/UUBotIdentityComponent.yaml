UUBotIdentityComponent:
  summary: "集中配置机器人标识，供 ROS 桥等 uBot 使用方读取。字段留空时，带 Resolved 的查询节点按规则返回回退值；默认 Actor 名称取自 AActor::GetName()，与编辑器标签无关，打包后仍采用相同规则。"
  sourceHash: "49d63fe7786e"

UUBotIdentityComponent.BaseComponent:
  summary: "机器人基座对应的场景组件。留空、引用无法解析或引用对象不是场景组件时，采用所属 Actor 的根组件。"
  sourceHash: "09240b82e713"

UUBotIdentityComponent.BaseFrameId:
  summary: "机器人基座的 TF 坐标系标识。留空时采用 base_link。"
  sourceHash: "2cea611347ad"

UUBotIdentityComponent.GetBaseComponent:
  summary: "返回指定场景组件；不可用时返回所属 Actor 的根组件，两者均不可用时返回空引用。"
  sourceHash: "90bf3ef3ed41"

UUBotIdentityComponent.GetBaseFrameId:
  summary: 返回 Base Frame Id；留空时返回 base_link。
  sourceHash: "5d3d26aba5df"

UUBotIdentityComponent.GetResolvedNamespace:
  summary: 返回 Namespace；留空时返回净化后的机器人 ID（`UBot::Identity::SanitizeNameToken`）。
  sourceHash: "b1f0bb4df4d0"

UUBotIdentityComponent.GetResolvedRobotId:
  summary: "返回 Robot Id；留空时返回所属 Actor 的名称，没有所属 Actor 时返回空字符串。"
  sourceHash: "44a1918d0b9c"

UUBotIdentityComponent.Namespace:
  summary: "ROS 命名空间。留空时采用净化后的机器人标识；显式填写时移除首尾空白字符和 /。"
  sourceHash: "b10cd976311e"

UUBotIdentityComponent.RobotId:
  summary: "机器人标识。留空时采用所属 Actor 的名称；解析时移除首尾空白字符。"
  sourceHash: "ef1c18bcf853"
