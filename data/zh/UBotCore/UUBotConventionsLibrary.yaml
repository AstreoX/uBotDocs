UUBotConventionsLibrary:
  summary: "为蓝图提供 UE（左手坐标系，长度单位为厘米）与 FLU（前、左、上，采用国际单位制的右手坐标系）之间的双向转换，适用于 ROS REP-103 和符合该轴向约定的 MuJoCo 等系统。对应 C++ 命名空间 UBot::RightHanded。"
  sourceHash: "aeb23a93bd5e"

UUBotConventionsLibrary.AngularVelocityRightHandedToUE:
  summary: "将角速度（rad/s）、力矩等轴向量从 右手坐标系 转换为 UE，分量映射为 (-x, y, -z)，保留输入单位。"
  sourceHash: "a52fe38d3042"

UUBotConventionsLibrary.AngularVelocityROSToUE:
  summary: "将角速度（rad/s）、力矩等轴向量从 ROS 坐标系 转换为 UE，分量映射为 (-x, y, -z)，保留输入单位。"
  sourceHash: "a52fe38d3042"

UUBotConventionsLibrary.AngularVelocityUEToRightHanded:
  summary: "将角速度（rad/s）、力矩等轴向量从 UE 转换为 右手坐标系，分量映射为 (-x, y, -z)，保留输入单位。"
  sourceHash: "a52fe38d3042"

UUBotConventionsLibrary.AngularVelocityUEToROS:
  summary: "将角速度（rad/s）、力矩等轴向量从 UE 转换为 ROS 坐标系，分量映射为 (-x, y, -z)，保留输入单位。"
  sourceHash: "a52fe38d3042"

UUBotConventionsLibrary.CameraLinkToOpticalRotation:
  summary: "返回相机光学坐标系（z 向前、x 向右、y 向下）相对相机本体坐标系（camera link frame）的旋转，遵循 ROS 约定。"
  sourceHash: "cb12ec14f663"

UUBotConventionsLibrary.GetOpticalFrameSuffix:
  summary: "返回追加到相机坐标系标识之后的后缀 _optical，用于构造光学坐标系标识。"
  sourceHash: "2ac2345162a2"

UUBotConventionsLibrary.PositionRightHandedToUE:
  summary: "将 右手坐标系 位置（米）转换为 UE 位置（厘米），分量映射为 (x, -y, z) × 100。"
  sourceHash: "e9b8400ca264"

UUBotConventionsLibrary.PositionROSToUE:
  summary: "将 ROS 坐标系 位置（米）转换为 UE 位置（厘米），分量映射为 (x, -y, z) × 100。"
  sourceHash: "497216224f76"

UUBotConventionsLibrary.PositionUEToRightHanded:
  summary: "将 UE 位置（厘米）转换为 右手坐标系 位置（米），分量映射为 (x, -y, z) / 100。"
  sourceHash: "32ac2d8eb156"

UUBotConventionsLibrary.PositionUEToROS:
  summary: "将 UE 位置（厘米）转换为 ROS 坐标系 位置（米），分量映射为 (x, -y, z) / 100。"
  sourceHash: "500276c348a4"

UUBotConventionsLibrary.RosTimeToSeconds:
  summary: "将 builtin_interfaces/Time 的 sec 和 nanosec 合成为以秒表示的时间。nanosec 为负数时按 0 处理。"
  sourceHash: "2f226d4070d1"

UUBotConventionsLibrary.RotationRightHandedToUE:
  summary: "将旋转四元数从 右手坐标系 转换为 UE，分量从 (x, y, z, w) 映射为 (-x, y, -z, w)，并归一化。"
  sourceHash: "584ee9b100d6"

UUBotConventionsLibrary.RotationROSToUE:
  summary: "将旋转四元数从 ROS 坐标系 转换为 UE，分量从 (x, y, z, w) 映射为 (-x, y, -z, w)，并归一化。"
  sourceHash: "584ee9b100d6"

UUBotConventionsLibrary.RotationUEToRightHanded:
  summary: "将旋转四元数从 UE 转换为 右手坐标系，分量从 (x, y, z, w) 映射为 (-x, y, -z, w)，并归一化。"
  sourceHash: "584ee9b100d6"

UUBotConventionsLibrary.RotationUEToROS:
  summary: "将旋转四元数从 UE 转换为 ROS 坐标系，分量从 (x, y, z, w) 映射为 (-x, y, -z, w)，并归一化。"
  sourceHash: "584ee9b100d6"

UUBotConventionsLibrary.SanitizeRosName:
  summary: "生成合法的 ROS 名称片段：仅保留 A-Z、a-z、0-9 和下划线，合并连续下划线，并在首字符为数字时添加下划线前缀；结果不会为空。"
  sourceHash: "38bd4b356bd6"

UUBotConventionsLibrary.SecondsToRosTime:
  summary: "将以秒表示的时间转换为 builtin_interfaces/Time 的 sec 和 nanosec。负数或非有限值返回 (0, 0)。"
  sourceHash: "a019408d75bc"

UUBotConventionsLibrary.TransformRightHandedToUE:
  summary: "将刚体变换从 右手坐标系 转换为 UE：镜像旋转，将平移从米转换为厘米，并丢弃缩放。"
  sourceHash: "ddfd5381b901"

UUBotConventionsLibrary.TransformROSToUE:
  summary: "将刚体变换从 ROS 坐标系 转换为 UE：镜像旋转，将平移从米转换为厘米，并丢弃缩放。"
  sourceHash: "ddfd5381b901"

UUBotConventionsLibrary.TransformUEToRightHanded:
  summary: "将刚体变换从 UE 转换为 右手坐标系：镜像旋转，将平移从厘米转换为米，并丢弃缩放。"
  sourceHash: "33ef4b800721"

UUBotConventionsLibrary.TransformUEToROS:
  summary: "将刚体变换从 UE 转换为 ROS 坐标系：镜像旋转，将平移从厘米转换为米，并丢弃缩放。"
  sourceHash: "33ef4b800721"

UUBotConventionsLibrary.VectorRightHandedToUE:
  summary: "将线速度、加速度或已以米表示的点坐标等线性量从 右手坐标系 转换为 UE，分量映射为 (x, -y, z)，保留输入单位。"
  sourceHash: "16b15e724bdb"

UUBotConventionsLibrary.VectorROSToUE:
  summary: "将线速度、加速度或已以米表示的点坐标等线性量从 ROS 坐标系 转换为 UE，分量映射为 (x, -y, z)，保留输入单位。"
  sourceHash: "16b15e724bdb"

UUBotConventionsLibrary.VectorUEToRightHanded:
  summary: "将线速度、加速度或已以米表示的点坐标等线性量从 UE 转换为 右手坐标系，分量映射为 (x, -y, z)，保留输入单位。"
  sourceHash: "399f14343ba0"

UUBotConventionsLibrary.VectorUEToROS:
  summary: "将线速度、加速度或已以米表示的点坐标等线性量从 UE 转换为 ROS 坐标系，分量映射为 (x, -y, z)，保留输入单位。"
  sourceHash: "399f14343ba0"

UUBotConventionsLibrary.YawRightHandedToUE:
  summary: "将平面航向角、扫描角（rad）或偏航角速度（rad/s）从 右手坐标系 转换为 UE，输出为输入的相反数，保留输入单位。"
  sourceHash: "8c265b2f53e3"

UUBotConventionsLibrary.YawROSToUE:
  summary: "将平面航向角、扫描角（rad）或偏航角速度（rad/s）从 ROS 坐标系 转换为 UE，输出为输入的相反数，保留输入单位。"
  sourceHash: "a0c8c1359067"

UUBotConventionsLibrary.YawUEToRightHanded:
  summary: "将平面航向角、扫描角（rad）或偏航角速度（rad/s）从 UE 转换为 右手坐标系，输出为输入的相反数，保留输入单位。"
  sourceHash: "ea797ae2ce92"

UUBotConventionsLibrary.YawUEToROS:
  summary: "将平面航向角、扫描角（rad）或偏航角速度（rad/s）从 UE 转换为 ROS 坐标系，输出为输入的相反数，保留输入单位。"
  sourceHash: "e9c26905bf78"
