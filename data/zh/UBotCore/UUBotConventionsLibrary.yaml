UUBotConventionsLibrary:
  summary: 在蓝图里使用 UE 与 ROS（REP-103）的坐标和时间约定，对应 C++ 的 UBot::Ros。
  sourceHash: "8983fd730f85"

UUBotConventionsLibrary.AngularVelocityROSToUE:
  summary: 角速度、力矩等轴向量（单位 rad/s），ROS 转 UE：(-x, y, -z)。
  sourceHash: "a52fe38d3042"

UUBotConventionsLibrary.AngularVelocityUEToROS:
  summary: 角速度、力矩等轴向量（单位 rad/s），UE 转 ROS：(-x, y, -z)。
  sourceHash: "a52fe38d3042"

UUBotConventionsLibrary.CameraLinkToOpticalRotation:
  summary: 相机光学系（z 向前、x 向右、y 向下）相对相机 link 系的旋转，ROS 约定。
  sourceHash: "cb12ec14f663"

UUBotConventionsLibrary.GetOpticalFrameSuffix:
  summary: 接在相机 frame id 后面、组成光学系 frame id 的后缀 _optical。
  sourceHash: "2ac2345162a2"

UUBotConventionsLibrary.PositionROSToUE:
  summary: 位置，ROS 的米转 UE 的厘米：(x, -y, z) × 100。
  sourceHash: "497216224f76"

UUBotConventionsLibrary.PositionUEToROS:
  summary: 位置，UE 的厘米转 ROS 的米：(x, -y, z) / 100。
  sourceHash: "500276c348a4"

UUBotConventionsLibrary.RosTimeToSeconds:
  summary: 把 builtin_interfaces/Time 的 sec 和 nanosec 换成秒。nanosec 为负数时按 0 处理。
  sourceHash: "2f226d4070d1"

UUBotConventionsLibrary.RotationROSToUE:
  summary: 旋转四元数，ROS 转 UE：(x, y, z, w) 变为归一化的 (-x, y, -z, w)。
  sourceHash: "584ee9b100d6"

UUBotConventionsLibrary.RotationUEToROS:
  summary: 旋转四元数，UE 转 ROS：(x, y, z, w) 变为归一化的 (-x, y, -z, w)。
  sourceHash: "584ee9b100d6"

UUBotConventionsLibrary.SanitizeRosName:
  summary: 生成合法的 ROS 名字片段：只保留 A-Z、a-z、0-9 和下划线，连续下划线合并，首字符是数字时加前缀下划线，结果不会为空。
  sourceHash: "38bd4b356bd6"

UUBotConventionsLibrary.SecondsToRosTime:
  summary: 把秒换成 builtin_interfaces/Time 的 sec 和 nanosec。负数或非有限值得到 (0, 0)。
  sourceHash: "a019408d75bc"

UUBotConventionsLibrary.TransformROSToUE:
  summary: 刚体变换，ROS 转 UE：旋转镜像，平移从米换成厘米，缩放丢弃。
  sourceHash: "ddfd5381b901"

UUBotConventionsLibrary.TransformUEToROS:
  summary: 刚体变换，UE 转 ROS：旋转镜像，平移从厘米换成米，缩放丢弃。
  sourceHash: "33ef4b800721"

UUBotConventionsLibrary.VectorROSToUE:
  summary: 已是 SI 单位的线性量，ROS 转 UE：(x, -y, z)，不换算单位。
  sourceHash: "16b15e724bdb"

UUBotConventionsLibrary.VectorUEToROS:
  summary: 线速度、加速度、以米为单位的点等线性量，UE 转 ROS：(x, -y, z)，不换算单位。
  sourceHash: "399f14343ba0"

UUBotConventionsLibrary.YawROSToUE:
  summary: 平面航向角、扫描角或偏航角速度（弧度），ROS 转 UE：UE = -ROS。
  sourceHash: "a0c8c1359067"

UUBotConventionsLibrary.YawUEToROS:
  summary: 平面航向角、扫描角或偏航角速度（弧度），UE 转 ROS：ROS = -UE。
  sourceHash: "e9c26905bf78"
