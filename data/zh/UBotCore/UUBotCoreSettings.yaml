UUBotCoreSettings:
  summary: "uBot Core 项目设置，配置入口为「Project Settings > Plugins > uBot Core」，保存在 DefaultEngine.ini。"
  sourceHash: "ed2a55533cf9"

UUBotCoreSettings.AdditionalPackageIndexFiles:
  summary: "额外的 Package 索引文件（格式 2），支持绝对路径或相对于项目目录的路径，在主索引之后加载。主索引优先采用 uBot Manager 写入的 Saved/uBot/index.json，文件不存在时采用 uBotCore 自带的 Index/index.json。"
  sourceHash: "b8570b49f88a"

UUBotCoreSettings.FixedTimeStepHz:
  summary: "固定步长频率，单位 Hz，范围 1 到 1000。启用 Use Fixed Time Step 后可编辑。"
  sourceHash: "c6a1970584c9"

UUBotCoreSettings.GitExecutable:
  summary: "命令行工具（commandlet）安装和更新 Package 时使用的 Git 可执行文件。"
  sourceHash: "de0a0b0b9a60"

UUBotCoreSettings.PackageInstallDirectory:
  summary: "命令行工具（commandlet）安装 Package 的目录，相对于项目目录解析。"
  sourceHash: "351679543ff9"

UUBotCoreSettings.bUseFixedTimeStep:
  summary: "启用后，每个 Game 或 PIE 世界开始运行（BeginPlay）时会启用引擎固定步长。"
  sourceHash: "cbaf81e2bd10"

UUBotCoreSettings.bValidatePackagesOnStartup:
  summary: "所有模块加载完成后，检查已安装的 uBot Package，并将每个问题写入日志。"
  sourceHash: "08b7884e1267"
