UUBotClockSubsystem.GetSimTimeSeconds:
  summary: "返回当前 World 的 uBot 仿真时间，单位 s。所有 uBot 时间戳均采用该时间基准。"
  sourceHash: "9d98974e9ecf"

UUBotClockSubsystem:
  summary: "为 Game 或 PIE 世界提供仿真时钟，支持读取时间和帧号、设置固定步长，以及暂停、恢复和单步执行。"
  sourceHash: "e99f44b48ee5"

UUBotClockSubsystem.GetRemainingStepFrames:
  summary: "返回当前单步任务剩余的世界更新（world tick）次数；没有正在执行的单步任务时为 0。"
  sourceHash: "e3b0c44298fc"

UUBotClockSubsystem.GetSimFrame:
  summary: "返回游戏时间已推进的 world tick 次数，世界暂停时不递增。"
  sourceHash: "48265a0217b3"

UUBotClockSubsystem.IsFixedTimeStepEnabled:
  summary: "返回引擎当前是否启用固定步长，该设置由整个进程共享。"
  sourceHash: "e3b0c44298fc"

UUBotClockSubsystem.IsSimulationPaused:
  summary: "返回当前世界是否处于暂停状态。"
  sourceHash: "e3b0c44298fc"

UUBotClockSubsystem.PauseSimulation:
  summary: "暂停游戏，并取消尚未完成的单步任务。"
  sourceHash: "1c8f52e2e196"

UUBotClockSubsystem.ResumeSimulation:
  summary: "解除暂停并取消尚未完成的单步任务，使世界恢复持续运行。"
  sourceHash: "41bd54cba487"

UUBotClockSubsystem.SetFixedTimeStep:
  summary: "启用或关闭由整个进程共享的引擎固定步长。`Step Hz` 限制在 1 到 1000 Hz；最后一个曾修改该设置的时钟销毁时，恢复原始值。"
  sourceHash: "873900e3606f"

UUBotClockSubsystem.StepSimulation:
  summary: "解除暂停，完成 `Num Frames` 个 world tick 后再次暂停，仅统计调用后开始的 tick。`Num Frames` 小于 1 或无法解除暂停时返回 false；单步任务执行期间再次调用时，指定帧数会累加到剩余帧数。"
  sourceHash: "12b8167ee08d"
