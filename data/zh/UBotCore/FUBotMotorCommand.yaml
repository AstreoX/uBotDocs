FUBotMotorCommand:
  summary: "逐电机控制指令，每个电机对应一个数值，排列顺序必须与接收方的电机顺序一致。"
  sourceHash: "4f70fbf382dc"

FUBotMotorCommand.Source:
  summary: "指令来源标签，采用自由格式，例如 ROS、MCP 或 Blueprint。"
  sourceHash: "9030c0986c07"

FUBotMotorCommand.TimestampSeconds:
  summary: 发出指令时的仿真时间，单位秒。
  sourceHash: "c2d8ddc4c0fb"

FUBotMotorCommand.Type:
  summary: "指定 `Values` 中各数值的含义：占最大值的比例（0 到 1），或电机转速（rad/s）。"
  sourceHash: "d0ad8882c525"

FUBotMotorCommand.Values:
  summary: "电机指令值数组，每个电机对应一个数值。"
  sourceHash: "d62c96da0e2d"

Make:FUBotMotorCommand:
