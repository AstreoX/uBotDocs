UUBotMotorCommandable:
  summary: "接收逐电机控制指令的接口，独立于执行器接口。"
  sourceHash: "e3b0c44298fc"

UUBotMotorCommandable.ApplyMotorCommand:
  summary: "应用电机指令。指令值数量不符、目标尚未就绪或数值无效等情况下，返回 false 表示拒绝。"
  sourceHash: "e1d1951f95f8"

UUBotMotorCommandable.GetMotorCount:
  summary: "返回电机数量，电机指令值数组的长度必须与该数量一致。"
  sourceHash: "7c2818bb9e77"

UUBotMotorCommandable.ReleaseMotorCommand:
  summary: "通知接收方发送方已停止发送指令，例如指令超时；接收方随后执行已配置的指令中断处理。"
  sourceHash: "7ba5ea3086df"
