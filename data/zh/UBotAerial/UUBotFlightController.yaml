UUBotFlightController:
  summary: "物理多旋翼飞行控制器的基类；运动组件以指定物理步间隔传入真值状态和当前设定值，调用 `Compute Motor Commands` 并执行返回的归一化电机指令。C++ 子类需重写对应 `_Implementation` 函数；蓝图子类经蓝图虚拟机运行，可增大 `Controller Rate Divider` 以降低默认 1 kHz 调用频率带来的开销。"
  sourceHash: "17d677c41420"

UUBotFlightController.ComputeMotorCommands:
  summary: 返回这一步的归一化电机指令（0 到 1，按电机顺序每个转子一个）。`Delta Seconds` 是到下次调用的时间，单位 s。
  sourceHash: "11a6e229ab7d"

UUBotFlightController.ResetController:
  summary: "清空飞行控制器的积分项和目标等内部状态，并接收所控制无人机的机架参数。"
  sourceHash: "f620ed89dba9"

UUBotFlightController.SupportsControlMode:
  summary: "返回此飞行控制器是否支持 `Mode` 指定模式的设定值。电机模式不经过飞行控制器。"
  sourceHash: "12197ca4c482"
