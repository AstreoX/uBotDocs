Break:FUBotWindSettings:
  summary: "将 UBot Wind Settings 拆分为恒定风速、阵风标准差、阵风相关时间和种子。"
  sourceHash: "027649c6abd3"

FUBotWindSettings:
  summary: "由恒定风和阵风组成的风场设置。阵风由种子决定相位的正弦分量叠加产生；相同设置在相同仿真时刻给出相同风速。"
  sourceHash: "fd9635a497c7"

FUBotWindSettings.ConstantVelocityMetersPerSecond:
  summary: "世界坐标系恒定风速，单位 m/s，方向是空气移动的方向。"
  sourceHash: "72a61a1a1f49"

FUBotWindSettings.GustCorrelationTimeSeconds:
  summary: 阵风的典型持续时间，单位 s，越长越平缓。默认 2 s，不小于 0.05 s。
  sourceHash: "130be0efe3d6"

FUBotWindSettings.GustStandardDeviationMetersPerSecond:
  summary: 每个世界轴阵风的标准差，单位 m/s；0 关闭阵风。
  sourceHash: "d015ace53e4a"

FUBotWindSettings.Seed:
  summary: 阵风的种子，种子相同则阵风相同。
  sourceHash: "5016a472f38c"

Make:FUBotWindSettings:
  summary: 用各字段组装一个 UBot Wind Settings。
  sourceHash: "9e216cfb0906"
