UUBotMultirotorMovementComponent:
  summary: "多旋翼飞行模型基类，按 uBot 仿真时间以固定物理步移动根组件，对其碰撞形状执行扫掠并沿接触面滑动，地面也按普通接触面处理，每帧呈现外推到当前仿真时间的位姿。支持 `IUBotVelocityCommandable` 航向坐标系速度指令：X 沿当前航向向前、Y 向右、Z 向上，角速度仅使用 Z 轴偏航分量；通过 `IUBotBodyStateSource` 提供根组件最近物理步的真值状态并声明驱动所有权，因此物理后端不能重复绑定该组件。"
  sourceHash: "0e605edabaa9"

UUBotMultirotorMovementComponent.ActuatorId:
  summary: "向 uBot 报告的执行器 ID。为空时，优先使用所属 Actor 的 `uBot Identity` 提供的机器人 ID；没有该组件时使用 Actor 名称。"
  sourceHash: "170deb3b26ce"

UUBotMultirotorMovementComponent.ContactFriction:
  summary: "接触时的滑动摩擦系数：从滑动速度中扣除撞击速度乘以该系数的值。"
  sourceHash: "44ce2f8ddbb3"

UUBotMultirotorMovementComponent.GetLastVelocityCommand:
  summary: 最近一条被接受的速度指令（限幅之后）。
  sourceHash: "f0b38df72371"

UUBotMultirotorMovementComponent.GetMultirotorState:
  summary: 最近一个物理步的真值状态（SI 单位，UE 世界轴）。
  sourceHash: "a2afeef21e22"

UUBotMultirotorMovementComponent.GetPhysicsStepCount:
  summary: "开始播放以来已运行的物理步数。"
  sourceHash: "8a1e86e6c768"

UUBotMultirotorMovementComponent.GetRotorLayout:
  summary: "按电机序号返回转子在机体坐标系下的位置（m，UE 坐标轴）和旋转方向，默认采用臂长 0.225 m 的四旋翼 X 机架，按 PX4 顺序排列为右前、左后、左前、右后。可根据返回值放置对应 `Rotor Index` 的 `uBot Rotor` 组件；组件在开始播放时从此布局读取旋转方向。"
  sourceHash: "c68962301c8d"

UUBotMultirotorMovementComponent.ImpactEventMinSpeedMetersPerSecond:
  summary: 沿表面法线的撞击速度低于这个值时不触发 `On Impact`，单位 m/s。
  sourceHash: "97d731b17725"

UUBotMultirotorMovementComponent.MaxStepsPerFrame:
  summary: "每帧允许执行的最大物理步数。单帧所需步数超过上限时，跳过多出的模拟时间，并记录一次警告。"
  sourceHash: "5a22ab92cd27"

UUBotMultirotorMovementComponent.OnImpact:
  summary: 无人机开始接触物体，且撞击速度不低于 `Impact Event Min Speed` 时触发。
  sourceHash: "2c446f6b3fcd"

UUBotMultirotorMovementComponent.PhysicsRateHz:
  summary: 每秒仿真时间的物理步数，单位 Hz。步数越多越准确，开销也越大。
  sourceHash: "da19aece6c79"

UUBotMultirotorMovementComponent.ResetFlight:
  summary: "停止所有运动，并将无人机重置为在当前位姿悬停的初始飞行状态。"
  sourceHash: "75f0690a80bd"

UUBotMultirotorMovementComponent.TeleportMultirotor:
  summary: 把无人机移到新位姿，不做扫掠检测。勾选 `Stop Motion` 时速度清零，无人机在新位置悬停。
  sourceHash: "6312d1acf94d"

UUBotMultirotorMovementComponent.VelocityLimits:
  summary: 超过这些限制的速度指令会被限幅。
  sourceHash: "e87c872d1a49"

UUBotMultirotorMovementComponent.bEnableWind:
  summary: "`uBot Wind` 的风是否影响这架无人机。"
  sourceHash: "dd927b4a9adc"
