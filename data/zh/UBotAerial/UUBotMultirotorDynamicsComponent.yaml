UUBotMultirotorDynamicsComponent:
  summary: "用于飞行控制研究的刚体多旋翼模型，模拟电机响应滞后、旋翼推力、反扭矩、空气相对阻力和重力，并按 uBot 仿真时间以固定步长积分。支持航向坐标系下的速度指令，以及姿态、角速度和单电机指令；前三类由飞行控制器转换为电机指令。"
  sourceHash: "01beaa0b9708"

UUBotMultirotorDynamicsComponent.Airframe:
  summary: 质量、转动惯量、旋翼和阻力。改动在下一次 Reset Flight 时生效。
  sourceHash: "4902e932eefa"

UUBotMultirotorDynamicsComponent.CommandLossAction:
  summary: 指令中断时无人机的动作：发送方释放了指令，或指令超过 Command Timeout Seconds 没有更新。
  sourceHash: "72ae36687aa3"

UUBotMultirotorDynamicsComponent.CommandTimeoutSeconds:
  summary: "指令未更新的仿真时长超过此值时，判定为指令中断，单位 s。0 表示由发送方负责超时处理；uBot ROS 组件具有独立的超时设置。"
  sourceHash: "1356f82560c1"

UUBotMultirotorDynamicsComponent.ControllerRateDivider:
  summary: "飞行控制器两次运行之间间隔的物理步数，期间保持上一次的电机指令。默认值为 1，即每个物理步运行一次。"
  sourceHash: "47a817d0b874"

UUBotMultirotorDynamicsComponent.DynamicsBackendName:
  summary: "动力学后端名称，取自扩展点 `UBotAerial.DynamicsBackend`。该接口属于实验性功能；`BuiltIn` 表示插件内置积分器。"
  sourceHash: "9539c10be757"

UUBotMultirotorDynamicsComponent.FlightController:
  summary: "处理速度、姿态和角速度指令的飞行控制器。可以换成自定义子类。"
  sourceHash: "3c250e6b6853"

UUBotMultirotorDynamicsComponent.GetActiveControlMode:
  summary: 最近一条被接受的指令的控制模式；无人机自己悬停时为 Velocity。
  sourceHash: "ab4273c3b35b"

UUBotMultirotorDynamicsComponent.GetFlightSetpoint:
  summary: "返回飞行控制器当前跟踪的设定值。"
  sourceHash: "fef2d536ffe7"

UUBotMultirotorDynamicsComponent.GetHoverMotorCommand:
  summary: 在当前机架和世界重力下保持水平悬停的归一化电机指令。
  sourceHash: "d601d27c58fb"

UUBotMultirotorDynamicsComponent.GetLastMotorCommands:
  summary: 最近一个物理步实际施加的电机指令（归一化，按电机顺序）。会复制整个数组。
  sourceHash: "b07314a04441"

UUBotMultirotorDynamicsComponent.LandingSpeedMetersPerSecond:
  summary: 指令中断动作为 Land 时的下降速度，单位 m/s。
  sourceHash: "500446f4595e"

UUBotMultirotorDynamicsComponent.PhysicsRateHz:
  summary: 每秒仿真时间的物理步数，单位 Hz。步数越多越精确，开销也越大。
  sourceHash: "da19aece6c79"

UUBotMultirotorDynamicsComponent.SetFlightController:
  summary: "替换飞行控制器，并立即重置它。传入空值时回退到内置的级联飞行控制器。"
  sourceHash: "f82d0f0c42e8"

UUBotMultirotorDynamicsComponent.bAcceptAttitudeCommands:
  summary: 是否接受姿态指令。
  sourceHash: "817897e538a4"

UUBotMultirotorDynamicsComponent.bAcceptBodyRateCommands:
  summary: 是否接受角速度指令。
  sourceHash: "8a947f78ccc2"

UUBotMultirotorDynamicsComponent.bAcceptMotorCommands:
  summary: 是否接受单电机指令。
  sourceHash: "a2d7831d5f04"

UUBotMultirotorDynamicsComponent.bAcceptVelocityCommands:
  summary: 是否接受速度指令。
  sourceHash: "7edcf57331b7"
