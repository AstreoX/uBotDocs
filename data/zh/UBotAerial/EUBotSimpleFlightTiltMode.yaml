EUBotSimpleFlightTiltMode:
  summary: 简化飞行模型倾斜的对象。
  sourceHash: "773d0177c887"

EUBotSimpleFlightTiltMode.Body:
  summary: "根组件随机体倾角变化，附着于根组件的传感器也采用该倾斜姿态。"
  sourceHash: "3edfe95fea9a"

EUBotSimpleFlightTiltMode.None:
  summary: "根组件和视觉组件均不倾斜，无人机仅改变偏航角。"
  sourceHash: "e5b1d2b3b41e"

EUBotSimpleFlightTiltMode.Visual:
  summary: "仅视觉组件倾斜，根组件及附着于根组件的其他组件保持水平。"
  sourceHash: "b34dba444655"
