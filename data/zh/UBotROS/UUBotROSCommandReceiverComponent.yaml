UUBotROSCommandReceiverComponent:
  summary: ROS 指令接收组件的基类，通过 uBot ROS 桥接收 ROS 2 指令，并将指令传递给实现了对应 uBotCore 接口的目标，不包含控制逻辑。默认订阅话题为 /<namespace>/<子类的末段名>，QoS 为 best_effort / volatile / 历史深度 10；命名空间由 uBot Identity 解析，可通过 Robot Namespace Override 覆盖，Command Topic Override 可替换整个话题。目标通过 Target Component 指定；未指定时，优先使用实现了对应接口的所属 Actor，否则使用第一个实现该接口的组件；未找到目标时，仍解码指令、触发事件并执行超时检测。超过 Command Timeout Seconds 的仿真时间未收到新指令时，调用一次目标的指令释放接口，并触发 On Command Timeout；目标随后执行其配置的指令丢失处理行为。游戏结束时，仍然生效的指令也会被释放。
  sourceHash: "909b13bb6787"

UUBotROSCommandReceiverComponent.CommandTimeoutSeconds:
  summary: "距上一条有效指令经过的仿真时间超过该值时，释放当前指令；单位 s，0 表示关闭超时检测。"
  sourceHash: "b48bb8b664d0"

UUBotROSCommandReceiverComponent.CommandTopicOverride:
  summary: 非空时替代 /<namespace>/<末段名>，缺少前导 / 会补上。
  sourceHash: "440dc871b5ee"

UUBotROSCommandReceiverComponent.GetCommandError:
  summary: 最近一条错误说明；自上次启动以来没有错误时为空。
  sourceHash: "efe85aee6d9b"

UUBotROSCommandReceiverComponent.GetCommandTarget:
  summary: "返回接收指令的目标对象；未配置目标、仅通过事件处理指令时返回空值。"
  sourceHash: "abafa4ea41a4"

UUBotROSCommandReceiverComponent.GetResolvedCommandTopic:
  summary: 正在订阅的话题；没有订阅时，是下一次启动会用的话题。
  sourceHash: "218cb5619372"

UUBotROSCommandReceiverComponent.IsCommandActive:
  summary: 从收到有效指令到超时为 true；超时关闭时，收到过指令后一直为 true。
  sourceHash: "3e091e986679"

UUBotROSCommandReceiverComponent.IsCommandReceiverReady:
  summary: 订阅已注册时返回 true，与桥的连接状态无关。
  sourceHash: "771f6ce90bdb"

UUBotROSCommandReceiverComponent.OnCommandError:
  summary: 订阅失败、消息畸形或无效、目标不可用或拒绝了指令时触发。
  sourceHash: "84d47453bd2a"

UUBotROSCommandReceiverComponent.OnCommandTimeout:
  summary: 每次超时触发一次，在目标（如果有）被释放之后。
  sourceHash: "ced785eedeae"

UUBotROSCommandReceiverComponent.RestartCommandReceiver:
  summary: 取消订阅后用当前设置重新订阅，超时计时继续。
  sourceHash: "9816aa565cd2"

UUBotROSCommandReceiverComponent.RobotNamespaceOverride:
  summary: 留空时用 uBot Identity 解析出的命名空间（没有 Identity 组件则用经过名称规范化处理的 Actor 名）。前后的 / 被忽略，每一段都会进行名称规范化处理；只含 / 表示根命名空间。
  sourceHash: "8105ae6e8aae"

UUBotROSCommandReceiverComponent.SetTargetComponent:
  summary: 用一个组件直接替换 Target Component；传入空值时恢复在所属 Actor 上自动查找。
  sourceHash: "70268dabf778"

UUBotROSCommandReceiverComponent.StopCommandReceiver:
  summary: 取消订阅；已生效指令的超时计时继续进行。
  sourceHash: "edfddb2e08cc"

UUBotROSCommandReceiverComponent.TargetComponent:
  summary: 接收指令的组件，必须实现该子类对应的接口。留空时用所属 Actor，或它第一个实现该接口的组件；仅设置 Referenced Actor 时，在该 Actor 上执行相同的查找。
  sourceHash: "05b36c93c605"

UUBotROSCommandReceiverComponent.bAutoStartReceiver:
  summary: Begin Play 时订阅；关闭后调用 Restart Command Receiver 开始接收。
  sourceHash: "d6c0079ec0ad"
