EUBotROSBridgeStatus:
  summary: 一个世界与 ubot_ros_bridge 之间 TCP 连接的状态。
  sourceHash: "eeb0aceb3c36"

EUBotROSBridgeStatus.Connected:
  summary: 握手完成，可以收发数据。
  sourceHash: "e3b0c44298fc"

EUBotROSBridgeStatus.Connecting:
  summary: 正在尝试第一次连接，等待桥的握手应答。
  sourceHash: "e3b0c44298fc"

EUBotROSBridgeStatus.Disabled:
  summary: "当前未启用连接：已调用 Disconnect，或 Auto Connect 已关闭且尚未调用 Connect。"
  sourceHash: "e3b0c44298fc"

EUBotROSBridgeStatus.Error:
  summary: 最近一次连接尝试失败，或已建立的连接断开；每隔 Reconnect Interval Seconds 重试。
  sourceHash: "e3b0c44298fc"
