UUBotROSAttitudeCommandComponent:
  summary: "接收 ROS 2 的 mavros_msgs/msg/AttitudeTarget 消息，经换算后传递给实现了 UBot Attitude Commandable 的目标，例如包含 uBot Multirotor Dynamics 组件的无人机。默认话题为 /<namespace>/cmd_attitude；type_mask 未设置 IGNORE_ATTITUDE（128）时，使用从 ROS 世界坐标系换算到 UE 的 orientation，忽略 body_rate；设置该标志时，使用从前、左、上（FLU）机体坐标系换算到 UE 的 body_rate，带有 IGNORE_ROLL_RATE（1）、IGNORE_PITCH_RATE（2）或 IGNORE_YAW_RATE（4）标志的轴按 0 处理。thrust 表示最大推力的比例，范围 0 到 1；未设置 IGNORE_THRUST（64）时使用该值，否则由飞行器保持高度。需要 mavros_msgs 消息包（ros-humble-mavros-msgs）。"
  sourceHash: "ca8b42f32faa"

UUBotROSAttitudeCommandComponent.GetLastAttitudeCommand:
  summary: 最近一条有效的姿态指令；收到首条指令之前姿态为单位四元数。
  sourceHash: "a1142cb0f554"

UUBotROSAttitudeCommandComponent.GetLastBodyRateCommand:
  summary: 最近一条有效的机体角速度指令；收到首条指令之前全为 0。
  sourceHash: "68ff7ecb1d40"

UUBotROSAttitudeCommandComponent.OnAttitudeCommand:
  summary: 每条有效姿态指令换算之后触发，无论是否存在目标对象，均会触发。
  sourceHash: "4b285c5faa16"

UUBotROSAttitudeCommandComponent.OnBodyRateCommand:
  summary: 每条有效机体角速度指令换算之后触发，无论是否存在目标对象，均会触发。
  sourceHash: "4f91bdefab55"
