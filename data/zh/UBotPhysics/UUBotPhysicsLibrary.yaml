UUBotPhysicsLibrary:
  summary: 查询 uBot 物理后端，以及某个组件由哪个后端模拟的蓝图函数库。
  sourceHash: "e24cb33e1dfd"

UUBotPhysicsLibrary.GetBodyPhysicsBackend:
  summary: 返回模拟 `Component` 的后端名；由 Chaos（引擎自带的物理）模拟时为 `None`。
  sourceHash: "0729593d9cb4"

UUBotPhysicsLibrary.GetDroppedPhysicsSteps:
  summary: "返回当前世界中指定 `Backend` 因单帧所需步数超过上限而跳过的累计物理步数。跳过的物理步不会在后续帧补执行，计数持续累加。"
  sourceHash: "7b6f05ca5ad4"

UUBotPhysicsLibrary.GetPhysicsBackendCapabilities:
  summary: "返回 `Backend` 声明的模拟能力。指定名称的后端未注册时返回 false，所有能力字段均为 false。"
  sourceHash: "7cb2effc9ef2"

UUBotPhysicsLibrary.GetPhysicsBackendNames:
  summary: "按注册顺序返回已注册物理后端的名称，可选择其中一个名称设置绑定组件的 `Backend`。"
  sourceHash: "c0a04731ebfd"

UUBotPhysicsLibrary.GetPhysicsSceneStats:
  summary: "返回 `Backend` 在当前世界中最近接收的场景统计，包括静态与运动学碰撞体数量、形状数量，以及启用物理碰撞但未能导出的组件数量。该后端在当前世界中没有求解器时返回 false，各统计值为 0。"
  sourceHash: "0e0a28a2020a"
