UUBotPhysicsBindingComponent:
  summary: "将所属 Actor 的组件绑定到物理后端，由后端按 uBot 仿真时钟步进并更新组件位姿；绑定作为整体执行，一个组件最多属于一个绑定，且只能绑定同一 Actor 的组件。通过 `IUBotBodyStateSource` 提供绑定组件的真值状态；组件在 Chaos 中作为运动学体，碰撞设置不变，可推动 Chaos 物体但不受其推动，解绑时恢复原模拟状态，后端注销时还会将绑定状态设为 `BackendMissing`，重新注册后需再次调用 `Bind Physics Bodies`。"
  sourceHash: "f4c2e8cd308d"

UUBotPhysicsBindingComponent.Backend:
  summary: 模拟这些物体的后端名，即在 `UBotPhysics.Backend` 扩展点上注册的名字。调用 `Bind Physics Bodies` 时读取。
  sourceHash: "cd58f51244b8"

UUBotPhysicsBindingComponent.Bind:
  summary: "将所有目标组件绑定到后端，成功或已经绑定时返回 true；任何步骤失败时均撤销本次操作，返回 false。失败原因可通过 `Get Physics Binding Status` 和 `Get Physics Binding Error` 查询，相关运行时问题在下次绑定成功、解绑或结束播放时清除。"
  sourceHash: "5493139e9054"

UUBotPhysicsBindingComponent.Bodies:
  summary: "待绑定物体的列表，各项必须引用所属 Actor 的组件。列表为空时绑定所属 Actor 的根组件，根组件必须是图元组件（Primitive Component）。"
  sourceHash: "886bde4b7f28"

UUBotPhysicsBindingComponent.GetBindingError:
  summary: 最近一次 `Bind Physics Bodies` 失败的原因；其他情况为空。
  sourceHash: "448fa80128a8"

UUBotPhysicsBindingComponent.GetBindingStatus:
  summary: 返回绑定当前的状态。
  sourceHash: "ad11565ea58b"

UUBotPhysicsBindingComponent.GetBoundComponents:
  summary: 返回已交给后端的组件；未绑定时为空。
  sourceHash: "219351e77ea3"

UUBotPhysicsBindingComponent.Unbind:
  summary: "解除物体与后端的绑定：原先启用物理模拟的组件恢复 Chaos 模拟，并继承后端最后一个物理步的速度。同时清除失败的绑定状态。"
  sourceHash: "83bcfa9e7ec8"

UUBotPhysicsBindingComponent.bBindOnBeginPlay:
  summary: "是否在开始播放时自动绑定，默认开启。关闭后需显式调用 `Bind Physics Bodies`，例如在后端模型准备完成后调用。"
  sourceHash: "282e8fc2a1a3"
